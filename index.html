  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">

  <!-- Apply saved appearance before first paint (no flash). -->
  <script>
    (function () {
      window.Luma = window.Luma || {};
      try {
        var s = JSON.parse(localStorage.getItem('luma.settings') || 'null') || {};
        var root = document.documentElement;
        if (s.theme === 'light' || s.theme === 'dark') root.setAttribute('data-theme', s.theme);
        if (typeof s.glassAlpha === 'number') root.style.setProperty('--glass-alpha', String(s.glassAlpha));
      } catch (e) { /* storage unavailable */ }
    })();
  </script>

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/glass.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/views/home.css">
  <link rel="stylesheet" href="css/views/shop.css">

  <script defer src="js/core.js"></script>
  <script defer src="js/icons.js"></script>
  <script defer src="js/catalog.js"></script>

  <script defer src="js/views/product.js"></script>
  <script defer src="js/views/bag.js"></script>
  <script defer src="js/views/checkout.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
