  <!-- Apply saved appearance before first paint (no flash). -->
  <script>
    (function () {
      window.Luma = window.Luma || {};
      try {
        var s = JSON.parse(localStorage.getItem('luma.settings') || 'null') || {};
        var root = document.documentElement;
        if (s.theme === 'light' || s.theme === 'dark') root.setAttribute('data-theme', s.theme);
        if (typeof s.glassAlpha === 'number') root.style.setProperty('--glass-alpha', String(s.glassAlpha));
      } catch (e) { /* storage unavailable */ }
    })();
  </script>
